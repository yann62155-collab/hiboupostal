plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = 'fr.citizen.hiboupostal'
base { archivesName = 'hiboupostal' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Version imposée : net.neoforged:neoforge:21.1.215
    version = project.neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        hiboupostal { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/neoforge.mods.toml') { expand mod_version: mod_version }
}
